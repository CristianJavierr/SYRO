<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Tecnología SYRO para operar, vender y crecer: punto de venta, Cuadernito y ERP."
    />
    <title>SYRO</title>
    <link rel="preload" href="/assets/gasoek-one.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/assets/fonts.gstatic.com__s__geistmono__v5__or3nQ6H-1_WfwkMZI_qYFrcdmg.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/assets/hero.mp4" as="video" type="video/mp4" />
    <link rel="preload" href="/assets/image%2063%20(2).svg" as="image" type="image/svg+xml" />
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #060606;
      }

      body.is-loading {
        overflow: hidden;
      }

      .entry-loader {
        position: fixed;
        inset: 0;
        z-index: 80;
        pointer-events: none;
        visibility: hidden;
        opacity: 0;
        background: #060606;
        transition:
          opacity 0.4s cubic-bezier(0.16, 1, 0.3, 1),
          background-color 0.48s cubic-bezier(0.16, 1, 0.3, 1),
          visibility 0s linear 0.48s;
      }

      body.is-loading .entry-loader,
      body.is-leaving .entry-loader {
        visibility: visible;
        opacity: 1;
        transition-delay: 0s;
      }

      body.entry-window .entry-loader,
      body.entry-open .entry-loader,
      body.product-route .entry-loader.is-releasing {
        background-color: transparent;
      }

      body.is-leaving .entry-loader {
        background-color: #060606;
      }

      .entry-progress-bar {
        position: fixed;
        left: 40px;
        right: 40px;
        bottom: 96px;
        z-index: 82;
        height: 1.5px;
        transform: scaleX(0);
        transform-origin: left center;
      }

      .entry-progress-bar__track,
      .entry-progress-bar__fill {
        position: absolute;
        inset: 0;
        transform-origin: left center;
      }

      .entry-progress-bar__track {
        background: rgba(255, 255, 255, 0.24);
      }

      .entry-progress-bar__fill {
        background: #fff;
        transform: scaleX(0);
      }

    </style>
    <script>
      document.documentElement.classList.add("js");
      window.addEventListener("pageshow", (event) => {
        if (event.persisted) window.location.reload();
      });
      window.addEventListener("pagehide", () => {
        document.body.classList.remove("entry-window", "entry-open");
        document.body.classList.add("is-leaving");
      });
    </script>
  </head>
  <body class="is-loading">
    <div class="entry-loader" aria-live="polite" aria-label="Loading">
      <div class="entry-progress-bar" aria-hidden="true">
        <span class="entry-progress-bar__track"></span>
        <span class="entry-progress-bar__fill"></span>
      </div>
    </div>
    <div id="root"></div>
    <script src="https://cdn.jsdelivr.net/npm/lenis@1.1.13/dist/lenis.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
